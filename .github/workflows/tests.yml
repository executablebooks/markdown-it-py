# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: continuous-integration

on:
  push:
    branches: [master]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
  schedule:
    - cron: '0 0 * * 0'  # every week

permissions:
  contents: read

jobs:

  pre-commit:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - uses: pre-commit/action@v3.0.1

  tests:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['pypy-3.11', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[testing,linkify]
    - name: Check spec file is up to date
      run: |
        python tests/test_cmark_spec/get_cmark_spec.py
    - name: Run pytest
      run: |
        pytest tests/ --cov=markdown_it --cov-report=xml --cov-report=term-missing
    - name: Upload to Codecov
      # note currently not working for external contributions
      if: false && matrix.python-version == '3.10' && github.repository == 'executablebooks/markdown-it-py'
      uses: codecov/codecov-action@v5
      with:
        name: markdown-it-py-pytests
        flags: pytests
        files: ./coverage.xml
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

  test-plugins:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install markdown-it-py
      run: |
        python -m pip install --upgrade pip
        pip install .[testing]
    - name: clone and install mdit-py-plugins
      run: |
        git clone https://github.com/executablebooks/mdit-py-plugins.git
        pip install --no-deps -e mdit-py-plugins
    - name: Run pytest for unit tests of mdit-py-plugins
      run: cd mdit-py-plugins; pytest

  benchmark:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        pip install tox

    - name: Run benchmark
      run: tox -e py310-bench-core -- --benchmark-json bench-core.json

    - name: Upload data
      uses: actions/upload-artifact@v7
      with:
        name: bench-core
        path: bench-core.json
        if-no-files-found: error

  build:

    name: Build distributions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    # `python -m build` builds with the backend declared in pyproject.toml's [build-system],
    # so the release build cannot leave the declared range
    # (`pip install flit~=3.4 && flit build` now resolves flit 3.12 + flit_core 4.2 and crashes)
    - name: Install build tools
      run: python -m pip install --upgrade build twine
    - name: Build sdist and wheel
      run: python -m build
    - name: Check distribution metadata
      run: python -m twine check --strict dist/*
    - name: Check the tag matches the built version
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      shell: python
      run: |
        import os, pathlib, sys
        from packaging.version import Version

        tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
        versions = set()
        for path in pathlib.Path("dist").iterdir():
            if path.name.endswith(".whl"):
                versions.add(path.name.split("-")[1])
            elif path.name.endswith(".tar.gz"):
                versions.add(path.name.removesuffix(".tar.gz").rsplit("-", 1)[1])
        if {Version(v) for v in versions} != {Version(tag)}:
            sys.exit(f"tag {os.environ['GITHUB_REF_NAME']} does not match built version(s) {sorted(versions)}")
        print(f"tag matches built version {tag}")
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:

    name: Publish to PyPI
    needs: [allgood, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # trusted publishing; the only permission this job has
    environment:
      name: pypi
      url: https://pypi.org/p/markdown-it-py
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    # uploads the distributions built and checked by the `build` job,
    # with attestations (generated by default)
    - uses: pypa/gh-action-pypi-publish@release/v1

  allgood:
    # the required status check: keep the job id, and do not give it a `name:`.
    # It runs even when a job it needs fails or is skipped, and fails then,
    # whereas a skipped required check would count as passing
    if: always()
    runs-on: ubuntu-latest
    needs:
    - pre-commit
    - tests
    - build
    steps:
    - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35  # v1.3.0
      with:
        jobs: ${{ toJSON(needs) }}
