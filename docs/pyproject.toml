[project]
name = "docs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jupyter-sphinx>=0.5.3",
    "linkify-it-py>=1,<3",
    "markdown-it-py",
    "mdit-py-plugins>=0.5.0",
    "myst-parser",
    "sphinx>=8.2.3",
    "sphinx-book-theme>=1.2.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
    "sphinx-rtd-theme>=3.1.0",
]

[tool.uv.sources]
myst-parser = { git = "https://github.com/executablebooks/MyST-Parser.git", rev = "update-markdown-parser" }
markdown-it-py = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "commonmark>=0.9.2",
    "coverage>=7.14.2",
    "gprof2dot>=2025.4.14",
    "ipykernel>=7.3.0",
    "jupyter-sphinx>=0.5.3",
    "markdown>=3.10.2",
    "mdurl>=0.1.2",
    "mistletoe>=1.5.1",
    "mistune>=3.3.0",
    "mypy>=2.1.0",
    "myst-parser>=4.0.1",
    "panflute>=2.3.1",
    "pre-commit>=4.6.0",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "pytest-regressions>=2.11.0",
    "pytest-timeout>=2.4.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sphinx>=8.2.3",
    "sphinx-book-theme>=1.2.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
    "typing-extensions>=4.15.0",
]
